[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "searchrank-ai"
version = "0.1.0.dev0"
description = "An evidence-grounded agentic RAG system for smartphone search and comparison"
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1,<2",
    "numpy>=1.26,<3",
    "openai>=2,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "sentence-transformers>=5,<6",
    "streamlit>=1.40,<2",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured external test service",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
