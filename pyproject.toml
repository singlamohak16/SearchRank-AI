[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "searchrank-ai"
version = "0.1.0.dev0"
description = "An evidence-grounded agentic RAG system for smartphone search and comparison"
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = [
    "numpy>=1.26,<3",
    "sentence-transformers>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
